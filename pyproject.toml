[project]
name = "gusnet"
version = "0.1.0.dev0"
description = "GUSNet - a clean-room, Apache-2.0 one-stage object detector in PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Gustavo da Costa Vicente", email = "gustavodacostavicente@gmail.com" }]
keywords = ["object-detection", "pytorch", "computer-vision", "anchor-free"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.24",
    "pillow>=10.0",
    "opencv-python>=4.8",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
eval = ["pycocotools>=2.0.7"]
# onnxscript is required by torch's current ONNX exporter, not optional.
export = ["onnx>=1.16", "onnxruntime>=1.18", "onnxscript>=0.2"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/Gustavodacostavicente/gusnet"
Source = "https://github.com/Gustavodacostavicente/gusnet"
Issues = "https://github.com/Gustavodacostavicente/gusnet/issues"

[project.scripts]
gusnet = "gusnet.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gusnet"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["B008", "E741"]

[tool.ruff.lint.isort]
# Stated explicitly rather than inferred from the layout, so import order is
# identical on every platform and in CI.
known-first-party = ["gusnet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "error::RuntimeWarning",
    # The export tests deliberately use TorchScript and the legacy ONNX
    # exporter: they are the only paths that keep a data-dependent detection
    # count dynamic. Their deprecation notices are expected, not actionable.
    "ignore:.*torch.jit.script.*:FutureWarning",
    "ignore:.*legacy TorchScript-based ONNX export.*:DeprecationWarning",
    "ignore:.*will be removed.*:DeprecationWarning",
    "ignore:.*dynamic_axes.*:UserWarning",
    "ignore:.*from_dynamic_axes_to_dynamic_shapes.*:DeprecationWarning",
]

[tool.uv]
# PyTorch CPU wheels by default; install CUDA wheels explicitly when training:
#   uv pip install torch torchvision --index-url https://download.pytorch.org/whl/cu124
